[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-ternary"
version = "0.3.0"
description = "Ternary linear layers for MLX (2.25 bits per weight resident, same as MLX 2-bit)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jakevin" }]
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mlx-ternary-bench = "mlx_ternary.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
